[package]
name = "happy-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "happy-agent"
path = "sources/main.rs"

[[test]]
name = "supervisor-behavior"
path = "../happy-agent-supervisor/native/supervisor/tests/behavior.rs"

[[test]]
name = "supervisor-services"
path = "../happy-agent-supervisor/native/supervisor/tests/services.rs"

[[test]]
name = "supervisor-outgoing-proxy"
path = "../happy-agent-supervisor/native/supervisor/tests/outgoing_proxy.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
cuid2.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
happy-agent-base = { path = "../happy-agent-base" }
happy-providers = { path = "../happy-providers" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
jsonschema.workspace = true
rand.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
happy-agent-supervisor = { path = "../happy-agent-supervisor/native/supervisor" }

[dev-dependencies]
libc.workspace = true
reqwest.workspace = true
tempfile.workspace = true
