[package]
name = "happy-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "happy-agent"
path = "sources/main.rs"

[[test]]
name = "supervisor-behavior"
path = "../happy-agent-supervisor/native/supervisor/tests/behavior.rs"

[[test]]
name = "supervisor-services"
path = "../happy-agent-supervisor/native/supervisor/tests/services.rs"

[[test]]
name = "supervisor-outgoing-proxy"
path = "../happy-agent-supervisor/native/supervisor/tests/outgoing_proxy.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
cuid2.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
get-size2.workspace = true
happy-agent-base = { path = "../happy-agent-base" }
happy-providers = { path = "../happy-providers" }
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
monty-alloc.workspace = true
monty-pool.workspace = true
monty-proto.workspace = true
monty-types.workspace = true
jsonschema.workspace = true
rand.workspace = true
reqwest.workspace = true
image = { version = "0.25.9", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }
webp = "0.3.1"
regex-lite.workspace = true
regress = { version = "=0.11.1", features = ["utf16"] }
tracing.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
subtle = "2.6.1"
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
uuid.workspace = true
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
happy-agent-supervisor = { path = "../happy-agent-supervisor/native/supervisor" }

[dev-dependencies]
libc.workspace = true
reqwest.workspace = true
tempfile.workspace = true
