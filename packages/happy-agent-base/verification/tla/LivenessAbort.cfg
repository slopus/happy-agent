\* Liveness with aborts, no crashes: an abort ends the aborted work, the store settles, and only an abort leaves input queued.
CONSTANTS
    Msgs = {m1}
    NumCalls = 2
    MaxOffers = 2
    MaxCrashes = 0
    MaxAborts = 1
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call"}
    ForeignCtxTools = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
PROPERTIES
    EventuallyQuiescent
    AbortTerminates
    EventuallySettled
    EventuallyConsumedUnlessAborted
