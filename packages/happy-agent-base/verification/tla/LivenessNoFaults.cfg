\* Liveness without crashes or aborts: everything accepted is consumed, the agent settles.
CONSTANTS
    Msgs = {m1, m2}
    NumCalls = 2
    MaxOffers = 2
    MaxCrashes = 0
    MaxAborts = 0
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call"}
    ForeignCtxTools = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
PROPERTIES
    EventuallyQuiescent
    EventuallyAllConsumed
    EventuallySettled
    AbortTerminates
