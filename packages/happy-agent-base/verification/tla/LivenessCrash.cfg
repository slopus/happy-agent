\* Liveness with one crash, no aborts: the agent comes back, finishes, settles, and consumes every accepted message.
CONSTANTS
    Msgs = {m1}
    NumCalls = 2
    MaxOffers = 2
    MaxCrashes = 1
    MaxAborts = 0
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call"}
    ForeignCtxTools = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
PROPERTIES
    EventuallyQuiescent
    EventuallySettled
    EventuallyAllConsumed
