\* Safety invariants with two crashes: 1 message (duplicate delivery), 1 tool call, 1 abort, 1 compaction.
CONSTANTS
    Msgs = {m1}
    NumCalls = 1
    MaxOffers = 2
    MaxCrashes = 2
    MaxAborts = 1
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call", "eof"}
    ForeignCtxTools = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AcceptedExactlyOnce
    IdentityDedup
    IdentityTracksMessage
    HistoryWellFormed
    NoMessageInsideToolExchange
    ToolStateClearedWithResult
    SettledIsClean
    ToolEntriesMatchHistory
    NonDurableAtMostOnce
    DurableBounded
    StaleBlockResetBeforeNewOutput
    NoToolStartAfterAbort
