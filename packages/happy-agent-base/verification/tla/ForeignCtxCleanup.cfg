\* Former finding 5: a tool that ignores cancellation and writes through a context it kept leaves no call state and no run state behind a settled agent.
CONSTANTS
    Msgs = {m1}
    NumCalls = 1
    MaxOffers = 1
    MaxCrashes = 0
    MaxAborts = 1
    MaxCompactions = 0
    MaxBlocks = 1
    EndStates = {"normal", "error", "tool_call"}
    ForeignCtxTools = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SettledCallStateClean
    SettledRunKVClean
