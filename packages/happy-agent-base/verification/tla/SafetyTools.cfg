\* Safety invariants: 1 message (duplicate delivery), 2 tool calls (batches, durable and plain), 1 crash, 1 abort, 1 compaction.
CONSTANTS
    Msgs = {m1}
    NumCalls = 2
    MaxOffers = 2
    MaxCrashes = 1
    MaxAborts = 1
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call", "eof"}
    ForeignCtxTools = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AcceptedExactlyOnce
    IdentityDedup
    IdentityTracksMessage
    HistoryWellFormed
    NoMessageInsideToolExchange
    ToolStateClearedWithResult
    SettledIsClean
    ToolEntriesMatchHistory
    NonDurableAtMostOnce
    DurableBounded
    StaleBlockResetBeforeNewOutput
    NoToolStartAfterAbort
