\* Provider-native compaction during an open response, including crash/restart and abort.
CONSTANTS
    Msgs = {m1}
    NumCalls = 1
    MaxOffers = 1
    MaxCrashes = 1
    MaxAborts = 1
    MaxCompactions = 1
    MaxBlocks = 2
    EndStates = {"normal", "error", "tool_call", "eof"}
    ForeignCtxTools = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    AcceptedExactlyOnce
    IdentityDedup
    IdentityTracksMessage
    HistoryWellFormed
    NoMessageInsideToolExchange
    ToolEntriesMatchHistory
    ToolStateClearedWithResult
    SettledIsClean
    NoToolStartAfterAbort
    NonDurableAtMostOnce
    DurableBounded
    DurableWorkImpliesActiveAtCrash
    StaleBlockResetBeforeNewOutput
    RequestNeverEndsWithResponse
PROPERTIES
    NativeCompactionPreservesContinuation
