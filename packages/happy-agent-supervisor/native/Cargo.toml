[workspace]
members = ["supervisor"]
resolver = "2"

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libc = "0.2.183"
regex-lite = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
