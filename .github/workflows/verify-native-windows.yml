name: Verify Windows native runtime

on:
    workflow_dispatch:
        inputs:
            native_only:
                description: Execute kernel regressions without building the product executable
                type: boolean
                default: false
    workflow_call:
        inputs:
            native_only:
                description: Execute kernel regressions without building the product executable
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    process-owner:
        name: Execute native Windows process regressions
        runs-on: windows-2025
        timeout-minutes: 20
        env:
            CARGO_TERM_COLOR: never
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Configure the existing Windows release target
              run: rustup target add x86_64-pc-windows-msvc
            - name: Compile the Windows process owner and its tests
              run: cargo test --locked -p happy-agent-supervisor --lib --target x86_64-pc-windows-msvc --no-run
            - name: Execute real Job, ConPTY, pipe, environment, and shutdown tests
              run: |
                  $output = cargo test --locked -p happy-agent-supervisor --lib --target x86_64-pc-windows-msvc -- --test-threads=1 --nocapture 2>&1
                  $status = $LASTEXITCODE
                  $output | ForEach-Object { $_.ToString() }
                  if ($status -ne 0) { exit $status }
                  $result = $output | Select-String '^test result: ok\. 15 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [0-9.]+s$'
                  if (@($result).Count -ne 1) { throw 'The Windows kernel gate must execute exactly 15 tests without failures, ignored tests, or filters.' }

    product-runtime:
        name: Verify the Windows product executable
        needs: process-owner
        if: ${{ !inputs.native_only }}
        runs-on: windows-2025
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Configure the existing Windows release target
              run: rustup target add x86_64-pc-windows-msvc
            - name: Build the single Windows executable without signing or publication
              run: pnpm --filter @slopus/happy-agent build:native --target win32-x64
            - name: Execute the product smoke check against that executable
              run: node packages/happy-agent/scripts/smoke-rust-runtime.mjs packages/happy-agent/dist/bin/happy-agent-win32-x64.exe
            - name: Install the existing fixture daemon dependency
              run: pnpm install --frozen-lockfile
            - name: Execute real Windows command sessions and cleanup through the production runner
              run: node packages/happy-agent/tests/runner/windows-cli.mjs packages/happy-agent/dist/bin/happy-agent-win32-x64.exe
