name: Release Happy Agent
run-name: Release Happy Agent v${{ inputs.version }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Semantic version without the leading v
                required: true
                type: string
            release_notes:
                description: Markdown change notes for the GitHub Release
                required: true
                type: string
            prerelease:
                description: Mark the GitHub Release as a prerelease
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: release-happy-agent
    cancel-in-progress: false

env:
    RELEASE_TAG: v${{ inputs.version }}
    RELEASE_VERSION: ${{ inputs.version }}
    RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
    verify:
        name: Verify release inputs and source
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Check out main
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Validate release inputs
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                      echo "Happy Agent releases must be dispatched from main." >&2
                      exit 1
                  fi
                  if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Version must be semantic and must not include the leading v." >&2
                      exit 1
                  fi
                  if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
                      echo "Release notes must not be blank." >&2
                      exit 1
                  fi
                  git fetch origin main --tags
                  if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
                      echo "Happy Agent releases must start from the current main branch." >&2
                      exit 1
                  fi
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                      echo "Tag $RELEASE_TAG already exists." >&2
                      exit 1
                  fi
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG already exists." >&2
                      exit 1
                  fi

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Enable Linux user namespaces
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Happy Agent JavaScript
              run: |
                  pnpm --filter @slopus/happy-agent-modules build
                  pnpm --filter @slopus/happy-agent build

            - name: Run type checks
              run: |
                  pnpm --filter @slopus/happy-agent-modules check
                  pnpm --filter @slopus/happy-agent check

            - name: Run tests
              env:
                  HOME: ${{ runner.temp }}/happy-agent-test-home
              run: |
                  mkdir -p "$HOME"
                  pnpm --filter @slopus/happy-agent-modules test
                  pnpm --filter @slopus/happy-agent test

    build:
        name: Build ${{ matrix.target }}
        needs: verify
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        env:
            APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
            APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
            CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      target: darwin-arm64
                    - runner: macos-15-intel
                      target: darwin-x64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                    - runner: ubuntu-24.04
                      target: linux-x64

        steps:
            - name: Check out the verified commit
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Enable Linux user namespaces
              if: runner.os == 'Linux'
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Happy Agent JavaScript
              run: |
                  pnpm --filter @slopus/happy-agent-modules build
                  pnpm --filter @slopus/happy-agent build

            - name: Prepare Happy Desktop signing credentials
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  test -n "$CSC_LINK"
                  test -n "$CSC_KEY_PASSWORD"
                  test -n "$APPLE_NOTARY_KEY_P8_BASE64"
                  test -n "$APPLE_API_KEY_ID"
                  test -n "$APPLE_API_ISSUER"
                  test -n "$APPLE_TEAM_ID"
                  test "$APPLE_TEAM_ID" = "466DQWDR8C"

                  certificate="$RUNNER_TEMP/happy-agent-signing.p12"
                  keychain="$RUNNER_TEMP/happy-agent-signing.keychain-db"
                  keychain_password="$(openssl rand -hex 32)"
                  printf '%s' "$CSC_LINK" | base64 -D > "$certificate"
                  security create-keychain -p "$keychain_password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$keychain_password" "$keychain"
                  security import "$certificate" \
                      -k "$keychain" \
                      -P "$CSC_KEY_PASSWORD" \
                      -T /usr/bin/codesign
                  security set-key-partition-list \
                      -S apple-tool:,apple: \
                      -s \
                      -k "$keychain_password" \
                      "$keychain"
                  identity="$(security find-identity -v -p codesigning "$keychain" \
                      | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
                      | head -1)"
                  test -n "$identity"

                  notary_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"
                  chmod 600 "$notary_key"

                  printf 'HAPPY_AGENT_CODESIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
                  printf 'HAPPY_AGENT_SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
                  printf 'APPLE_API_KEY=%s\n' "$notary_key" >> "$GITHUB_ENV"

            - name: Sign Tailcat before embedding
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  source="packages/happy-agent/assets/tailcat/v0.4.0/$TARGET/tailcat"
                  signed="$GITHUB_WORKSPACE/packages/happy-agent/dist/vendor/tailcat-v0.4.0-$TARGET-signed"
                  mkdir -p "$(dirname "$signed")"
                  cp "$source" "$signed"
                  codesign \
                      --force \
                      --identifier com.slopus.happy.agent.tailcat \
                      --keychain "$HAPPY_AGENT_SIGNING_KEYCHAIN" \
                      --options runtime \
                      --sign "$HAPPY_AGENT_CODESIGN_IDENTITY" \
                      --timestamp \
                      "$signed"
                  codesign --verify --strict --verbose=2 "$signed"
                  test "$("$signed" version)" = "v0.4.0"
                  printf 'HAPPY_AGENT_SIGNED_TAILCAT_PATH=%s\n' "$signed" >> "$GITHUB_ENV"
              env:
                  TARGET: ${{ matrix.target }}

            - name: Compile Happy Agent standalone binary
              run: |
                  pnpm --filter @slopus/happy-agent build:bun --target "$TARGET"
              env:
                  HAPPY_AGENT_RELEASE_VERSION: ${{ inputs.version }}
                  TARGET: ${{ matrix.target }}

            - name: Sign Happy Agent
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  codesign \
                      --force \
                      --identifier com.slopus.happy.agent \
                      --keychain "$HAPPY_AGENT_SIGNING_KEYCHAIN" \
                      --options runtime \
                      --sign "$HAPPY_AGENT_CODESIGN_IDENTITY" \
                      --timestamp \
                      --entitlements packages/happy-agent/assets/macos/entitlements.plist \
                      "$binary"
                  codesign --verify --strict --verbose=2 "$binary"
              env:
                  TARGET: ${{ matrix.target }}

            - name: Smoke test the release binary
              shell: bash
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  test "$("$binary" --version)" = "Happy Agent $RELEASE_VERSION"
                  "$binary" --help >/dev/null
                  node packages/happy-agent/scripts/smoke-binary-transports.mjs "$binary"

                  smoke_root="$(mktemp -d /tmp/happy-agent-release.XXXXXX)"
                  export HAPPY_HOME_DIR="$smoke_root/home"
                  cleanup() {
                      "$binary" stop >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  "$binary" start
                  "$binary" status
                  "$binary" stop
                  for attempt in {1..100}; do
                      status_output="$("$binary" status)"
                      if [[ "$status_output" == *"Daemon is not running."* ]]; then
                          trap - EXIT
                          exit 0
                      fi
                      sleep 0.1
                  done
                  echo "$status_output" >&2
                  exit 1
              env:
                  TARGET: ${{ matrix.target }}

            - name: Notarize Happy Agent and embedded Tailcat
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  binary="$GITHUB_WORKSPACE/packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  payload="$RUNNER_TEMP/happy-agent-notary-$TARGET"
                  archive="$RUNNER_TEMP/happy-agent-notary-$TARGET.zip"
                  mkdir -p "$payload"
                  cp "$binary" "$payload/happy-agent"
                  cp "$HAPPY_AGENT_SIGNED_TAILCAT_PATH" "$payload/tailcat"
                  ditto -c -k --keepParent "$payload" "$archive"

                  set +e
                  submission="$(xcrun notarytool submit "$archive" \
                      --issuer "$APPLE_API_ISSUER" \
                      --key "$APPLE_API_KEY" \
                      --key-id "$APPLE_API_KEY_ID" \
                      --output-format json \
                      --wait)"
                  submit_status=$?
                  set -e
                  printf '%s\n' "$submission"
                  submission_id="$(jq -r '.id // empty' <<< "$submission")"
                  notary_status="$(jq -r '.status // empty' <<< "$submission")"
                  if [[ $submit_status -ne 0 || "$notary_status" != "Accepted" ]]; then
                      if [[ -n "$submission_id" ]]; then
                          xcrun notarytool log "$submission_id" \
                              --issuer "$APPLE_API_ISSUER" \
                              --key "$APPLE_API_KEY" \
                              --key-id "$APPLE_API_KEY_ID"
                      fi
                      exit 1
                  fi

                  codesign --verify --strict --verbose=2 "$binary"
                  codesign --verify --strict --verbose=2 "$HAPPY_AGENT_SIGNED_TAILCAT_PATH"
                  spctl --assess --type execute --verbose=4 "$binary"
                  spctl --assess --type execute --verbose=4 "$HAPPY_AGENT_SIGNED_TAILCAT_PATH"
              env:
                  TARGET: ${{ matrix.target }}

            - name: Package release asset
              shell: bash
              run: |
                  mkdir -p release-assets
                  archive="happy-agent-$RELEASE_VERSION-$TARGET.tar.gz"
                  tar -czf "release-assets/$archive" \
                      -C packages/happy-agent/dist/bin \
                      "happy-agent-$TARGET"
                  (
                      cd release-assets
                      shasum -a 256 "$archive" > "$archive.sha256"
                  )
              env:
                  TARGET: ${{ matrix.target }}

            - name: Upload release asset
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: happy-agent-${{ matrix.target }}
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 7

            - name: Remove Apple signing credentials
              if: always() && runner.os == 'macOS'
              shell: bash
              run: |
                  if [[ -n "${HAPPY_AGENT_SIGNING_KEYCHAIN:-}" ]]; then
                      security delete-keychain "$HAPPY_AGENT_SIGNING_KEYCHAIN" || true
                  fi
                  rm -f \
                      "$RUNNER_TEMP/happy-agent-signing.p12" \
                      "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

    publish:
        name: Publish GitHub Release
        needs:
            - verify
            - build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write

        steps:
            - name: Check out the verified commit
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Download release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: happy-agent-*
                  path: release-assets
                  merge-multiple: true

            - name: Confirm the release target
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git fetch origin main --tags
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "The verified commit is no longer on main." >&2
                      exit 1
                  fi
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                      echo "Tag $RELEASE_TAG was created while this release was building." >&2
                      exit 1
                  fi
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      echo "Release $RELEASE_TAG was created while this release was building." >&2
                      exit 1
                  fi

            - name: Publish the tag and GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  mkdir -p .release
                  printf '%s\n' "$RELEASE_NOTES" > .release/notes.md
                  arguments=(
                      "$RELEASE_TAG"
                      --draft
                      --target "$GITHUB_SHA"
                      --title "Happy Agent $RELEASE_TAG"
                      --notes-file .release/notes.md
                  )
                  if [[ "$RELEASE_VERSION" == *-* || "$RELEASE_PRERELEASE" == "true" ]]; then
                      arguments+=(--prerelease)
                  fi
                  gh release create "${arguments[@]}" release-assets/*
                  publish_arguments=(--draft=false)
                  if [[ "$RELEASE_VERSION" != *-* && "$RELEASE_PRERELEASE" != "true" ]]; then
                      publish_arguments+=(--latest)
                  fi
                  gh release edit "$RELEASE_TAG" "${publish_arguments[@]}"
                  release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
                  printf 'Published [%s](%s).\n' "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
