name: Release Happy Agent
run-name: Release Happy Agent v${{ inputs.version }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Stable X.Y.Z or preview X.Y.Z-preview.N, without the leading v
                required: true
                type: string
            release_notes:
                description: Markdown change notes; Rust runtime currently excludes the product daemon/API
                required: true
                type: string
            prerelease:
                description: Must be true for preview versions and false for stable versions
                default: true
                type: boolean

permissions:
    contents: read

concurrency:
    group: release-happy-agent
    cancel-in-progress: false

env:
    RELEASE_TAG: v${{ inputs.version }}
    RELEASE_VERSION: ${{ inputs.version }}
    RELEASE_PRERELEASE: ${{ inputs.prerelease }}
    HAPPY_AGENT_RELEASE_VERSION: ${{ inputs.version }}

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - name: Validate release inputs
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Dispatch releases from main.' >&2; exit 1; }
                  [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.(0|[1-9][0-9]*))?$ ]] || exit 1
                  if [[ "$RELEASE_VERSION" == *-preview.* ]]; then
                      [[ "$RELEASE_PRERELEASE" == true ]] || exit 1
                  else
                      [[ "$RELEASE_PRERELEASE" == false ]] || exit 1
                  fi
                  [[ -n "${RELEASE_NOTES//[[:space:]]/}" ]] || exit 1
                  git fetch origin main --tags
                  [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || exit 1
                  ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null
                  ! gh release view "$RELEASE_TAG" >/dev/null 2>&1

    verify:
        needs: validate
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: rustup show active-toolchain
            - name: Enable the existing Unix sandbox test boundary
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi
            - run: pnpm check
            - run: pnpm test
            - run: node packages/happy-agent/scripts/smoke-rust-runtime.mjs target/debug/happy-agent

    windows:
        needs: validate
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/build-windows.yml
        with:
            version: ${{ inputs.version }}

    build:
        needs: validate
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: macos-15, target: darwin-arm64, rust: aarch64-apple-darwin }
                    - { runner: macos-15-intel, target: darwin-x64, rust: x86_64-apple-darwin }
                    - {
                          runner: ubuntu-24.04-arm,
                          target: linux-arm64,
                          rust: aarch64-unknown-linux-musl,
                      }
                    - { runner: ubuntu-24.04, target: linux-x64, rust: x86_64-unknown-linux-musl }
        env:
            TARGET: ${{ matrix.target }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
            APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
            CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: rustup target add ${{ matrix.rust }}
            - name: Install native musl support
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y musl-tools
            - name: Build the one runtime executable
              run: pnpm --filter @slopus/happy-agent build:native --target "$TARGET"
            - name: Prepare Apple signing credentials
              if: runner.os == 'macOS'
              run: |
                  test -n "$CSC_LINK"; test -n "$CSC_KEY_PASSWORD"
                  test -n "$APPLE_NOTARY_KEY_P8_BASE64"; test -n "$APPLE_API_KEY_ID"; test -n "$APPLE_API_ISSUER"
                  test "$APPLE_TEAM_ID" = 466DQWDR8C
                  certificate="$RUNNER_TEMP/happy-agent-signing.p12"
                  keychain="$RUNNER_TEMP/happy-agent-signing.keychain-db"
                  keychain_password="$(openssl rand -hex 32)"
                  printf '%s' "$CSC_LINK" | base64 -D > "$certificate"
                  security create-keychain -p "$keychain_password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$keychain_password" "$keychain"
                  security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
                  identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
                  test -n "$identity"
                  notary_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key"
                  chmod 600 "$notary_key"
                  printf 'HAPPY_AGENT_CODESIGN_IDENTITY=%s\nHAPPY_AGENT_SIGNING_KEYCHAIN=%s\nAPPLE_API_KEY=%s\n' "$identity" "$keychain" "$notary_key" >> "$GITHUB_ENV"
            - name: Sign the single Apple executable
              if: runner.os == 'macOS'
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  codesign --force --identifier com.slopus.happy.agent --keychain "$HAPPY_AGENT_SIGNING_KEYCHAIN" --options runtime --sign "$HAPPY_AGENT_CODESIGN_IDENTITY" --timestamp "$binary"
                  codesign --verify --strict --verbose=2 "$binary"
            - name: Smoke test the exact release binary
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  test "$("$binary" --version)" = "Happy Agent $RELEASE_VERSION"
                  node packages/happy-agent/scripts/smoke-rust-runtime.mjs "$binary"
            - name: Notarize the single Apple executable
              if: runner.os == 'macOS'
              run: |
                  payload="$RUNNER_TEMP/happy-agent-notary-$TARGET"
                  archive="$payload.zip"
                  mkdir -p "$payload"
                  cp "packages/happy-agent/dist/bin/happy-agent-$TARGET" "$payload/happy-agent"
                  ditto -c -k --keepParent "$payload" "$archive"
                  xcrun notarytool submit "$archive" --issuer "$APPLE_API_ISSUER" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --output-format json --wait > "$RUNNER_TEMP/notary.json"
                  test "$(jq -r .status "$RUNNER_TEMP/notary.json")" = Accepted
                  codesign --verify --strict --verbose=2 "packages/happy-agent/dist/bin/happy-agent-$TARGET"
            - name: Package native archive and npm platform package
              run: |
                  mkdir -p release-assets
                  archive="happy-agent-$RELEASE_VERSION-$TARGET.tar.gz"
                  tar -czf "release-assets/$archive" -C packages/happy-agent/dist/bin "happy-agent-$TARGET"
                  node packages/happy-agent/scripts/package-native.mjs platform --version "$RELEASE_VERSION" --target "$TARGET" --binary "packages/happy-agent/dist/bin/happy-agent-$TARGET" --output release-assets/npm
                  node packages/happy-agent/scripts/package-native.mjs root --version "$RELEASE_VERSION" --output .context/npm-root
                  node packages/happy-agent/scripts/verify-native-package.mjs ".context/npm-root/slopus-happy-agent-$RELEASE_VERSION.tgz" "release-assets/npm/slopus-happy-agent-$TARGET-$RELEASE_VERSION.tgz"
                  (cd release-assets && shasum -a 256 "$archive" > "$archive.sha256")
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: happy-agent-${{ matrix.target }}
                  path: |
                      release-assets/*.tar.gz
                      release-assets/*.sha256
                      release-assets/npm/*.tgz
                  if-no-files-found: error
                  retention-days: 7
            - name: Remove Apple signing credentials
              if: always() && runner.os == 'macOS'
              run: |
                  if [[ -n "${HAPPY_AGENT_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$HAPPY_AGENT_SIGNING_KEYCHAIN" || true; fi
                  rm -f "$RUNNER_TEMP/happy-agent-signing.p12" "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

    publish:
        name: Publish GitHub Release
        needs: [verify, build, windows]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: happy-agent-*
                  path: release-assets
                  merge-multiple: true
            - name: Generate the npm launcher tarball without publishing npm
              run: node packages/happy-agent/scripts/package-native.mjs root --version "$RELEASE_VERSION" --output release-assets/npm
            - name: Confirm the release target and checksums
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git fetch origin main --tags
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main
                  ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null
                  ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
                  (cd release-assets && for checksum in *.sha256; do sha256sum -c "$checksum"; done)
            - name: Publish the tag and GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  mkdir -p .release
                  printf '%s\n\n%s\n' "$RELEASE_NOTES" 'This Rust runtime release supplies provider inference, durable agents, and the Unix supervisor. The product daemon, desktop API, and terminal UI migration is incomplete.' > .release/notes.md
                  arguments=("$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Happy Agent $RELEASE_TAG" --notes-file .release/notes.md)
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then arguments+=(--prerelease --latest=false); fi
                  gh release create "${arguments[@]}" release-assets/*.tar.gz release-assets/*.sha256 release-assets/npm/*.tgz
                  publish_arguments=(--draft=false)
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then publish_arguments+=(--latest=false); else publish_arguments+=(--latest); fi
                  gh release edit "$RELEASE_TAG" "${publish_arguments[@]}"
