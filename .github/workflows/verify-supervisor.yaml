name: Verify happy-agent-supervisor

# The supervisor is a native binary whose whole purpose is an operating-system claim, and every
# claim it makes is architecture-specific: Seatbelt on macOS, and user namespaces, bind mounts and
# a hand-written seccomp filter on Linux, with the syscall numbers differing between x86_64 and
# aarch64. None of that can be proven by emulation — QEMU does not implement `prctl(PR_SET_SECCOMP)`
# at all — so each of the four shipped targets has to run its own tests on its own real kernel.
#
# This runs on demand only. It is slow, it exists to answer "does the boundary still hold", and
# that question is worth asking before a release or after touching the sandbox, not on every push.

on:
    workflow_dispatch:
        inputs:
            services_only:
                description: Verify published services and Docker boundaries on both Linux architectures
                type: boolean
                default: false
            windows_only:
                description: Build and validate only the standalone Windows Agent
                type: boolean
                default: false
            lsass_only:
                description: Measure only whether repeated Windows sandbox launches grow LSASS
                type: boolean
                default: false
            lsass_supervisor:
                description: Windows supervisor to measure, "source" or a published version such as 0.0.16
                type: string
                default: source

permissions:
    contents: read

concurrency:
    group: verify-supervisor-${{ github.ref }}-${{ inputs.lsass_only && inputs.lsass_supervisor || 'all' }}
    cancel-in-progress: true

jobs:
    compute-services:
        if: ${{ !inputs.lsass_only && (inputs.services_only || !inputs.windows_only) }}
        name: Published service runtime on ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @slopus/happy-agent-compute check
            - run: pnpm --filter @slopus/happy-agent-compute build
            - name: Allow only the installed supervisor to enter namespaces
              run: bash packages/happy-agent-supervisor/scripts/allow-published-test-namespaces.sh
            - name: Prove service I/O, endpoint transport, and controller-death cleanup
              run: >-
                  bash packages/happy-agent-supervisor/scripts/test-services.sh --command
                  pnpm --filter @slopus/happy-agent-compute test:live:services
            - name: Build the container test image
              run: docker build --tag happy-agent-compute-test:local packages/happy-agent-compute/tests/fixtures
            - name: Prove the explicit container namespace allowance
              run: bash packages/happy-agent-supervisor/scripts/test-container-namespaces.sh
            - name: Prove the container boundary
              env:
                  HAPPY_AGENT_COMPUTE_DOCKER_APPARMOR_PROFILE: happy-compute-container-tests
              run: pnpm --filter @slopus/happy-agent-compute test:live:docker

    windows:
        permissions:
            contents: read
            id-token: write
        if: ${{ !inputs.services_only && !inputs.lsass_only }}
        uses: ./.github/workflows/build-windows.yml
        with:
            version: 0.4.48-windows-ci.${{ github.run_number }}

    windows-lsass:
        if: ${{ inputs.lsass_only }}
        name: Windows sandbox launches do not grow LSASS (${{ inputs.lsass_supervisor }})
        runs-on: windows-2025
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Download the published supervisor
              if: ${{ inputs.lsass_supervisor != 'source' }}
              env:
                  SUPERVISOR_VERSION: ${{ inputs.lsass_supervisor }}
              run: |
                  $url = "https://registry.npmjs.org/@slopus/happy-agent-supervisor/-/happy-agent-supervisor-$env:SUPERVISOR_VERSION-win32-x64.tgz"
                  Invoke-WebRequest -Uri $url -OutFile supervisor.tgz
                  New-Item -ItemType Directory -Force supervisor-package | Out-Null
                  tar -xzf supervisor.tgz -C supervisor-package
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $destination = 'packages/happy-agent-supervisor/native/target/release'
                  New-Item -ItemType Directory -Force $destination | Out-Null
                  Copy-Item supervisor-package/package/vendor/x86_64-pc-windows-gnu/bin/*.exe $destination
            - name: Restore matching native build
              if: ${{ inputs.lsass_supervisor == 'source' }}
              id: native-cache
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: packages/happy-agent-supervisor/native/target/release
                  key: windows-sandbox-gnu195-v1-${{ hashFiles('.gitattributes', 'packages/happy-agent-supervisor/native/windows/**', 'packages/happy-agent-supervisor/scripts/build-native-windows.mjs') }}
            - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
              if: ${{ inputs.lsass_supervisor == 'source' && steps.native-cache.outputs.cache-hit != 'true' }}
              id: msys2
              with:
                  msystem: MINGW64
                  install: mingw-w64-x86_64-gcc
            - name: Build supervisor and matching helpers from source
              if: ${{ inputs.lsass_supervisor == 'source' && steps.native-cache.outputs.cache-hit != 'true' }}
              env:
                  MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
                  CARGO_BUILD_JOBS: "2"
              run: |
                  $env:PATH = "$env:MSYS2_LOCATION\mingw64\bin;$env:PATH"
                  rustup toolchain install 1.95.0-x86_64-pc-windows-gnu --profile minimal
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node packages/happy-agent-supervisor/scripts/build-native-windows.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Save the completed native build
              if: ${{ inputs.lsass_supervisor == 'source' && steps.native-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: packages/happy-agent-supervisor/native/target/release
                  key: ${{ steps.native-cache.outputs.cache-primary-key }}
            - name: Set up once on disposable runner
              run: |
                  if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Hosted CI only' }
                  & packages/happy-agent-supervisor/native/target/release/happy-agent-supervisor.exe --setup
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $status = & packages/happy-agent-supervisor/native/target/release/happy-agent-supervisor.exe --setup-status | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0 -or -not $status.ready) { throw 'Sandbox setup did not complete' }
                  "HAPPY_WINDOWS_SANDBOX_HOME=$($status.stateDirectory)" >> $env:GITHUB_ENV
                  'HAPPY_WINDOWS_SANDBOX_NO_PROVISION=1' >> $env:GITHUB_ENV
            - name: Measure LSASS across repeated sandbox launches
              run: node packages/happy-agent-supervisor/scripts/verify-native-windows-lsass.mjs
            - name: "Diagnostic: LSASS across bare CreateProcessWithLogonW launches"
              if: ${{ always() }}
              continue-on-error: true
              run: |
                  $users = Get-Content -Raw "$env:HAPPY_WINDOWS_SANDBOX_HOME\.sandbox-secrets\sandbox_users.json" | ConvertFrom-Json
                  Add-Type -AssemblyName System.Security
                  $blob = [Convert]::FromBase64String($users.offline.password)
                  $password = [Text.Encoding]::UTF8.GetString([Security.Cryptography.ProtectedData]::Unprotect($blob, $null, 'LocalMachine'))
                  $secure = ConvertTo-SecureString $password -AsPlainText -Force
                  $before = (Get-Process lsass).HandleCount
                  $sessionsBefore = @(Get-CimInstance Win32_LogonSession).Count
                  for ($i = 0; $i -lt 150; $i++) {
                      $info = [Diagnostics.ProcessStartInfo]::new('C:\Windows\System32\cmd.exe', '/d /c exit 0')
                      $info.UserName = $users.offline.username
                      $info.Domain = '.'
                      $info.Password = $secure
                      $info.UseShellExecute = $false
                      $info.LoadUserProfile = $false
                      $info.WorkingDirectory = 'C:\Windows\Temp'
                      $process = [Diagnostics.Process]::Start($info)
                      $process.WaitForExit()
                      $process.Dispose()
                  }
                  $after = (Get-Process lsass).HandleCount
                  Start-Sleep -Seconds 30
                  $settled = (Get-Process lsass).HandleCount
                  $sessionsSettled = @(Get-CimInstance Win32_LogonSession).Count
                  @{ phase = 'bare-logon'; launches = 150; lsassBefore = $before; lsassAfter = $after; lsassSettled = $settled; logonSessionsBefore = $sessionsBefore; logonSessionsSettled = $sessionsSettled } | ConvertTo-Json -Compress
            - name: "Diagnostic: sandbox logs"
              if: ${{ always() }}
              continue-on-error: true
              run: Get-ChildItem -Recurse "$env:HAPPY_WINDOWS_SANDBOX_HOME" -Filter *.log | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }

    supervisor:
        if: ${{ !inputs.windows_only && !inputs.services_only && !inputs.lsass_only }}
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            # Every target reports, so a regression on one architecture is visible as exactly that
            # rather than hidden behind whichever leg happened to fail first.
            fail-fast: false
            matrix:
                include:
                    - name: macOS arm64
                      runner: macos-15
                      target: aarch64-apple-darwin
                    - name: macOS x64
                      runner: macos-15-intel
                      target: x86_64-apple-darwin
                    - name: Linux arm64
                      runner: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-musl
                    - name: Linux x64
                      runner: ubuntu-24.04
                      target: x86_64-unknown-linux-musl

        defaults:
            run:
                working-directory: packages/happy-agent-supervisor/native

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Install the pinned Rust toolchain
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup target add "${{ matrix.target }}"

            - name: Report what the kernel actually offers
              # The fallback paths are chosen at runtime, so the kernel version is the difference
              # between a green run that exercised `mount_setattr` and one that exercised the
              # pre-5.12 remount walk. Record it rather than inferring it later from a green tick.
              run: uname -a

            - name: Build the release binary
              run: cargo build --locked --release --target "${{ matrix.target }}" --bin happy-agent-supervisor

            - name: Verify an enforced AppArmor denial before allowing the test binary
              if: runner.os == 'Linux'
              run: bash ../scripts/test-apparmor.sh "$PWD/target/${{ matrix.target }}/release/happy-agent-supervisor"

            - name: Allow namespaces only for the supervisor test binaries
              if: runner.os == 'Linux'
              # Keep Ubuntu's global restriction enabled. The two exact build paths receive the
              # application allowance; unrelated processes and the negative test remain confined.
              run: |
                  test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
                  sudo tee /etc/apparmor.d/happy-supervisor-tests >/dev/null <<EOF
                  abi <abi/4.0>,
                  include <tunables/global>
                  profile happy-supervisor-tests "$PWD/target/${{ matrix.target }}/{debug,release}/happy-agent-supervisor" flags=(unconfined) {
                      userns,
                  }
                  EOF
                  sudo apparmor_parser --replace /etc/apparmor.d/happy-supervisor-tests

            - name: Run the native test suite
              # Tests run against the shipped target, not the host default, so what is proven is
              # what is published. `--test-threads=1` keeps the behaviour tests from racing each
              # other over namespaces and listeners.
              run: cargo test --locked --target "${{ matrix.target }}" -- --test-threads=1

            - name: Lint
              run: cargo clippy --locked --all-targets --target "${{ matrix.target }}" -- -D warnings

            - name: Upload the binary
              uses: actions/upload-artifact@v4
              with:
                  name: happy-agent-supervisor-${{ matrix.target }}
                  path: packages/happy-agent-supervisor/native/target/${{ matrix.target }}/release/happy-agent-supervisor
                  if-no-files-found: error

    package:
        if: ${{ !inputs.windows_only && !inputs.services_only && !inputs.lsass_only }}
        name: TypeScript package
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-agent-supervisor check

            - name: Run unit tests
              run: pnpm --filter @slopus/happy-agent-supervisor test

            - name: Build the package
              run: pnpm --filter @slopus/happy-agent-supervisor build
