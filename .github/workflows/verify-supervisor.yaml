name: Verify happy-agent-supervisor

# The supervisor is part of the single happy-agent executable, and its whole purpose is an
# operating-system claim that is architecture-specific: Seatbelt on macOS, and user namespaces,
# bind mounts, FUSE and a hand-written seccomp filter on Linux, with the syscall numbers differing
# between x86_64 and aarch64. None of that can be proven by emulation, a cross-compile, or a
# sandbox without delegated cgroups, so each target runs its own tests on its own real kernel and
# every suite must report its exact count with nothing failed, ignored, or filtered away.
#
# This runs on demand only. It is slow, it exists to answer "does the boundary still hold", and
# that question is worth asking before a release or after touching the sandbox, not on every push.
# It never signs, packages for release, or publishes. With distribution_only it instead builds the
# five release executables exactly as a release would, under a version no release uses, packages
# them as the release archives and npm packages, and verifies them together; nothing is signed,
# published, or tagged. Dispatch it from the branch under test:
#   gh workflow run verify-supervisor.yaml --ref <branch>

on:
    workflow_dispatch:
        inputs:
            services_only:
                description: Verify published services and Docker boundaries on both Linux architectures
                type: boolean
                default: false
            windows_only:
                description: Validate only the native Windows runtime and its single executable
                type: boolean
                default: false
            windows_native_only:
                description: Execute only the native Windows kernel regressions
                type: boolean
                default: false
            distribution_only:
                description: Build, package, and verify the five release targets without signing or publishing
                type: boolean
                default: false
            docker_only:
                description: Verify native Docker compute through the single executable on a real Linux engine
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: verify-supervisor-${{ github.ref }}-${{ inputs.services_only }}-${{ inputs.windows_only }}-${{ inputs.distribution_only }}-${{ inputs.windows_native_only }}-${{ inputs.docker_only }}
    cancel-in-progress: true

jobs:
    compute-services:
        if: ${{ !inputs.docker_only && !inputs.windows_native_only && !inputs.distribution_only && (inputs.services_only || !inputs.windows_only) }}
        name: Published service runtime on ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @slopus/happy-agent-compute check
            - run: pnpm --filter @slopus/happy-agent-compute build
            - name: Allow only the installed supervisor to enter namespaces
              run: bash packages/happy-agent-supervisor/scripts/allow-published-test-namespaces.sh
            - name: Prove service I/O, endpoint transport, and controller-death cleanup
              run: >-
                  bash packages/happy-agent-supervisor/scripts/test-services.sh --command
                  pnpm --filter @slopus/happy-agent-compute test:live:services
            - name: Build the container test image
              run: docker build --tag happy-terminal-gym:local packages/happy-agent-compute/tests/fixtures
            - name: Prove the explicit container namespace allowance
              run: bash packages/happy-agent-supervisor/scripts/test-container-namespaces.sh
            - name: Prove the container boundary
              env:
                  HAPPY_AGENT_COMPUTE_DOCKER_APPARMOR_PROFILE: happy-compute-container-tests
              run: pnpm --filter @slopus/happy-agent-compute test:live:docker

    windows:
        name: Native Windows runtime
        permissions:
            contents: read
        if: ${{ inputs.windows_native_only || (!inputs.docker_only && !inputs.services_only && !inputs.distribution_only) }}
        uses: ./.github/workflows/verify-native-windows.yml
        with:
            native_only: ${{ inputs.windows_native_only }}

    native-linux:
        if: ${{ !inputs.docker_only && !inputs.windows_native_only && !inputs.windows_only && !inputs.distribution_only }}
        name: Native boundary on ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        strategy:
            # Every architecture reports, so a regression on one is visible as exactly that.
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        env:
            CARGO_TERM_COLOR: never
            # Product tests start sandboxed work through the built executable, never by
            # re-entering the unit-test binary.
            HAPPY_AGENT_TEST_COMPUTE_BINARY: ${{ github.workspace }}/target/debug/happy-agent
            PROOF_LOGS: ${{ github.workspace }}/.native-proof
            EXPECT: packages/happy-agent-supervisor/scripts/expect-rust-tests.sh
            DELEGATE: packages/happy-agent-supervisor/scripts/test-services.sh
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install the pinned Rust toolchain
              run: rustup show active-toolchain || rustup toolchain install

            - name: Record what the kernel offers
              # Configuration, not proof: the runtime picks its fallbacks from these, so record them
              # rather than inferring later which path a green run exercised.
              run: |
                  {
                      echo '### Kernel on ${{ matrix.runner }}'
                      echo '```'
                      uname -a
                      echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
                      echo "cgroup controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
                      echo "own cgroup: $(cat /proc/self/cgroup)"
                      ls -l /dev/fuse || echo "/dev/fuse is absent"
                      echo '```'
                      echo '| Suite | Result | Expected | Verdict |'
                      echo '| --- | --- | --- | --- |'
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Install the published client and fixture dependencies
              if: ${{ !inputs.services_only }}
              run: pnpm install --frozen-lockfile

            - name: Build the single executable and its test binaries
              run: |
                  cargo build --locked -p happy-agent --bin happy-agent
                  cargo test --locked -p happy-agent --no-run

            - name: Verify an enforced AppArmor denial before allowing the executable
              run: bash packages/happy-agent-supervisor/scripts/test-apparmor.sh "$HAPPY_AGENT_TEST_COMPUTE_BINARY" supervisor

            - name: Allow namespaces only for the built executable
              # Keep Ubuntu's global restriction enabled. The exact build path receives the
              # application allowance; unrelated processes and the negative test remain confined.
              run: |
                  test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
                  sudo tee /etc/apparmor.d/happy-agent-native-tests >/dev/null <<EOF
                  abi <abi/4.0>,
                  include <tunables/global>
                  profile happy-agent-native-tests "$HAPPY_AGENT_TEST_COMPUTE_BINARY" flags=(unconfined) {
                      userns,
                  }
                  EOF
                  sudo apparmor_parser --replace /etc/apparmor.d/happy-agent-native-tests

            - name: Prove supervised services under a delegated cgroup
              run: >-
                  bash "$DELEGATE" --command bash "$EXPECT" "supervisor services" exact 14 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test supervisor-services -- --include-ignored --test-threads=1

            - name: Prove the product service PTY and gateway teardown under a delegated cgroup
              run: >-
                  bash "$DELEGATE" --command bash "$EXPECT" "product service kernel" exact 1 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent
                  product::services::tests::native_service_uses_a_pty_and_revokes_an_established_gateway_before_cleanup
                  -- --include-ignored --exact --test-threads=1

            - name: Prove the supervisor boundary
              if: ${{ !inputs.services_only }}
              # `--test-threads=1` keeps the behaviour tests from racing over namespaces and listeners.
              run: >-
                  bash "$EXPECT" "supervisor behavior" exact 22 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test supervisor-behavior -- --test-threads=1

            - name: Prove the outgoing proxy
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "supervisor outgoing proxy" exact 10 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test supervisor-outgoing-proxy -- --test-threads=1

            - name: Prove the daemon's compute through a real restart
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "daemon compute" exact 2 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test original_agent_restart compute_acceptance:: -- --test-threads=1

            - name: Prove the file tools
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "file tools" exact 15 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::tools::files::tests:: -- --test-threads=1

            - name: Prove the runner peer
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "runner peer" exact 10 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent native_runner_ -- --test-threads=1

            - name: Prove runner program ownership and reconnects
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "runner product stdio" exact 10 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::owners::runners::program -- --test-threads=1

            - name: Prove runner program process capacity
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "runner program groups" exact 2 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent runner_programs_ -- --test-threads=1

            - name: Prove workflows
              if: ${{ !inputs.services_only }}
              run: >-
                  bash "$EXPECT" "workflows" exact 4 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::bots::tests::workflow_ -- --test-threads=1

            - name: Prove the restricted runner command end to end
              if: ${{ !inputs.services_only }}
              run: |
                  set -o pipefail
                  mkdir -p "$PROOF_LOGS"
                  node packages/happy-agent/tests/runner/restricted-cli.mjs 2>&1 | tee "$PROOF_LOGS/restricted-runner-cli.log"
                  echo '| restricted runner CLI | completed | exit 0 | pass |' >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the proof logs
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: native-proof-${{ matrix.runner }}
                  path: .native-proof
                  if-no-files-found: warn

    native-macos:
        if: ${{ !inputs.docker_only && !inputs.windows_native_only && !inputs.windows_only && !inputs.services_only && !inputs.distribution_only }}
        name: Native boundary on ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                runner: [macos-15, macos-15-intel]
        env:
            CARGO_TERM_COLOR: never
            PROOF_LOGS: ${{ github.workspace }}/.native-proof
            EXPECT: packages/happy-agent-supervisor/scripts/expect-rust-tests.sh
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install the pinned Rust toolchain
              run: rustup show active-toolchain || rustup toolchain install

            - name: Record the kernel
              run: |
                  { echo '### Kernel on ${{ matrix.runner }}'; echo '```'; uname -a; sw_vers; echo '```'; echo '| Suite | Result | Expected | Verdict |'; echo '| --- | --- | --- | --- |'; } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Build the single executable and its test binaries
              run: |
                  cargo build --locked -p happy-agent --bin happy-agent
                  cargo test --locked -p happy-agent --test supervisor-behavior --test supervisor-outgoing-proxy --no-run

            - name: Prove the Seatbelt boundary
              run: >-
                  bash "$EXPECT" "supervisor behavior" exact 7 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test supervisor-behavior -- --test-threads=1

            - name: Prove the outgoing proxy
              run: >-
                  bash "$EXPECT" "supervisor outgoing proxy" exact 10 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --test supervisor-outgoing-proxy -- --test-threads=1

            - name: Upload the proof logs
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: native-proof-${{ matrix.runner }}
                  path: .native-proof
                  if-no-files-found: warn

    package:
        if: ${{ !inputs.docker_only && !inputs.windows_native_only && !inputs.windows_only && !inputs.services_only && !inputs.distribution_only }}
        name: TypeScript package
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-agent-supervisor check

            - name: Run unit tests
              run: pnpm --filter @slopus/happy-agent-supervisor test

            - name: Build the package
              run: pnpm --filter @slopus/happy-agent-supervisor build

    distribution:
        if: ${{ inputs.distribution_only && !inputs.windows_native_only && !inputs.docker_only }}
        name: Distribution for ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: macos-15, target: darwin-arm64, rust: aarch64-apple-darwin }
                    - { runner: macos-15-intel, target: darwin-x64, rust: x86_64-apple-darwin }
                    - {
                          runner: ubuntu-24.04-arm,
                          target: linux-arm64,
                          rust: aarch64-unknown-linux-musl,
                      }
                    - { runner: ubuntu-24.04, target: linux-x64, rust: x86_64-unknown-linux-musl }
                    - { runner: windows-2025, target: win32-x64, rust: x86_64-pc-windows-msvc }
        defaults:
            run:
                shell: bash
        env:
            TARGET: ${{ matrix.target }}
            # A version no release uses, so these packages can never pass for published ones.
            DISTRIBUTION_VERSION: 0.0.0-preview.${{ github.run_number }}
            HAPPY_AGENT_RELEASE_VERSION: 0.0.0-preview.${{ github.run_number }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install the pinned Rust toolchain and the release target
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup target add ${{ matrix.rust }}

            - name: Install native musl support
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y musl-tools

            - name: Build the one executable exactly as a release does
              run: pnpm --filter @slopus/happy-agent build:native --target "$TARGET"

            - name: Record what the executable loads
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  if [[ "$TARGET" == win32-* ]]; then binary="$binary.exe"; fi
                  {
                      echo "### What happy-agent-$TARGET loads"
                      echo '```'
                      case "$TARGET" in
                          linux-*) file "$binary"; readelf -lW "$binary"; readelf -dW "$binary" ;;
                          darwin-*) file "$binary"; otool -L "$binary" ;;
                          win32-*) file "$binary"; node packages/happy-agent/scripts/pe-imports.mjs "$binary" || true ;;
                      esac
                      echo '```'
                  } | tee -a "$GITHUB_STEP_SUMMARY"
                  case "$TARGET" in
                      linux-*)
                          if readelf -lW "$binary" | grep -q INTERP; then
                              echo "The Linux executable names an ELF interpreter." >&2
                              exit 1
                          fi
                          if readelf -dW "$binary" | grep -q '(NEEDED)'; then
                              echo "The Linux executable needs a shared library." >&2
                              exit 1
                          fi
                          ;;
                      darwin-*)
                          # Only the operating system's own libraries may be loaded.
                          if otool -L "$binary" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
                              echo "The Apple executable loads a library the system does not provide." >&2
                              exit 1
                          fi
                          ;;
                      win32-*)
                          # The import tables, not strings in the file, say what it loads.
                          node packages/happy-agent/scripts/pe-imports.mjs "$binary" >/dev/null
                          ;;
                  esac

            - name: Smoke test the exact executable
              run: |
                  binary="packages/happy-agent/dist/bin/happy-agent-$TARGET"
                  if [[ "$TARGET" == win32-* ]]; then binary="$binary.exe"; fi
                  test "$("$binary" --version)" = "Happy Agent $DISTRIBUTION_VERSION"
                  node packages/happy-agent/scripts/smoke-rust-runtime.mjs "$binary"

            - name: Package the archive and the npm platform package
              run: |
                  binary="happy-agent-$TARGET"
                  if [[ "$TARGET" == win32-* ]]; then
                      binary="$binary.exe"
                      # Node's tar must be Windows' own, which reads drive letters as paths; Git
                      # Bash's GNU tar reads them as remote hosts.
                      export PATH="/c/Windows/System32:$PATH"
                  fi
                  mkdir -p distribution
                  archive="happy-agent-$DISTRIBUTION_VERSION-$TARGET.tar.gz"
                  tar -czf "distribution/$archive" -C packages/happy-agent/dist/bin "$binary"
                  node -e 'const [file] = process.argv.slice(1); const hash = require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(file)).digest("hex"); console.log(`${hash}  ${require("node:path").basename(file)}`);' "distribution/$archive" > "distribution/$archive.sha256"
                  node packages/happy-agent/scripts/package-native.mjs platform --version "$DISTRIBUTION_VERSION" --target "$TARGET" --binary "packages/happy-agent/dist/bin/$binary" --output "$RUNNER_TEMP/npm"
                  cp "$RUNNER_TEMP/npm/slopus-happy-agent-$TARGET-$DISTRIBUTION_VERSION.tgz" distribution/
                  node packages/happy-agent/scripts/package-native.mjs root --version "$DISTRIBUTION_VERSION" --output "$RUNNER_TEMP/npm-root"
                  node packages/happy-agent/scripts/verify-native-package.mjs "$RUNNER_TEMP/npm-root/slopus-happy-agent-$DISTRIBUTION_VERSION.tgz" "distribution/slopus-happy-agent-$TARGET-$DISTRIBUTION_VERSION.tgz"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: distribution-${{ matrix.target }}
                  path: distribution/*
                  if-no-files-found: error
                  retention-days: 7

    distribution-set:
        if: ${{ inputs.distribution_only && !inputs.windows_native_only && !inputs.docker_only }}
        needs: distribution
        name: Five-target distribution
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            DISTRIBUTION_VERSION: 0.0.0-preview.${{ github.run_number }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: distribution-*
                  path: distribution
                  merge-multiple: true

            - name: Generate the npm launcher package
              run: |
                  node packages/happy-agent/scripts/package-native.mjs root --version "$DISTRIBUTION_VERSION" --output "$RUNNER_TEMP/npm-root"
                  cp "$RUNNER_TEMP/npm-root/slopus-happy-agent-$DISTRIBUTION_VERSION.tgz" distribution/

            - name: Test the Windows import reader
              run: node --test packages/happy-agent/scripts/pe-imports.test.mjs

            - name: Verify the five targets together
              run: node packages/happy-agent/scripts/verify-native-distribution.mjs distribution "$DISTRIBUTION_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

    native-docker:
        if: ${{ inputs.docker_only && !inputs.windows_native_only && !inputs.distribution_only && !inputs.services_only && !inputs.windows_only }}
        name: Native Docker compute on a real Linux engine
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            CARGO_TERM_COLOR: never
            HAPPY_AGENT_TEST_COMPUTE_BINARY: ${{ github.workspace }}/target/debug/happy-agent
            PROOF_LOGS: ${{ github.workspace }}/.native-docker-proof
            EXPECT: packages/happy-agent-supervisor/scripts/expect-rust-tests.sh
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install the pinned toolchain and published fixture dependencies
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  pnpm install --frozen-lockfile

            - name: Record the exact engine and required FUSE identity
              run: |
                  docker version
                  uname -a
                  test -c /dev/fuse
                  ls -l /dev/fuse
                  test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
                  docker pull ubuntu:24.04
                  mkdir -p "$PROOF_LOGS"
                  git rev-parse HEAD | tee "$PROOF_LOGS/commit.txt"
                  echo '| Suite | Result | Expected | Verdict |' >> "$GITHUB_STEP_SUMMARY"
                  echo '| --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"

            - name: Build the whole executable and native test binary
              run: |
                  cargo build --locked -p happy-agent --bin happy-agent
                  cargo test --locked -p happy-agent --bin happy-agent --no-run

            - name: Verify local Docker contracts with no ignored cases
              run: >-
                  bash "$EXPECT" "Docker local contracts" exact 5 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::docker::tests::
                  -- --skip native_docker_ --test-threads=1

            - name: Prove default refusal and Source's explicit test-container namespace allowance
              run: bash packages/happy-agent/scripts/test-native-docker-namespaces.sh "$HAPPY_AGENT_TEST_COMPUTE_BINARY"

            - name: Verify retained file knowledge and native boundaries
              run: >-
                  bash "$EXPECT" "Docker file tool regressions" exact 15 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::tools::files::tests::
                  -- --test-threads=1

            - name: Prove actual container files, Skills, shells, PTYs, secrets, permissions and durable teardown
              env:
                  HAPPY_AGENT_TEST_DOCKER_APPARMOR_PROFILE: happy-compute-container-tests
              run: >-
                  bash "$EXPECT" "Docker engine contracts" exact 2 "$PROOF_LOGS" --
                  cargo test --locked -p happy-agent --bin happy-agent product::docker::tests::native_docker_
                  -- --include-ignored --test-threads=1 --nocapture

            - name: Confirm the host restriction remains enabled
              if: ${{ always() }}
              run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1

            - name: Upload exact Docker proof logs
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: native-docker-proof
                  path: .native-docker-proof
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7
