name: Temporary Linux takeover check

# Temporary: proves the SO_PEERCRED takeover on Linux before merge. Deleted before landing on main.
on:
    push:
        branches:
            - worktree/stale-daemon-takeover
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Linux takeover
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            HOME: ${{ github.workspace }}/.local/takeover-home
            NODE_OPTIONS: --max-old-space-size=6144

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Enable Linux user namespaces
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Build and verify the owned native Python worker
              uses: ./.github/actions/build-monty

            - name: Build
              run: |
                  pnpm --filter @slopus/happy-agent-client build
                  pnpm --filter @slopus/happy-agent-modules build
                  pnpm --filter @slopus/happy-agent build

            - name: Typecheck
              run: |
                  pnpm --filter @slopus/happy-agent check
                  pnpm --filter @slopus/happy-agent-gym-tests check

            - name: Peer credentials on Bun (SO_PEERCRED)
              working-directory: packages/happy-agent
              run: pnpm dlx bun@1.4.4 test ./tests/bun/readSocketPeer.bun.mjs

            - name: Lifecycle unit tests
              working-directory: packages/happy-agent
              run: >-
                  pnpm exec vitest run
                  tests/inspectAgentSocket.test.ts
                  tests/superviseAgentDaemon.test.ts
                  tests/superviseSpawnedDaemon.test.ts
                  tests/ensureAgentDaemonWorkingDirectory.test.ts
                  tests/ensureAgentDaemonToken.test.ts
                  tests/ensureAgentDaemonProtocol.test.ts
                  tests/runAgentDaemonCommand.test.ts
                  tests/runAgentDaemonSupervisor.test.ts
                  tests/runAgentDaemon.test.ts
                  tests/startHappyAgentDaemon.test.ts

            - name: Start replaces a daemon it cannot reach (gym)
              run: >-
                  pnpm --filter @slopus/happy-agent-gym-tests vitest:bun run
                  tests/cli_start_replaces_a_daemon_it_cannot_reach.test.ts
                  tests/cli_start_refuses_data_a_newer_release_migrated.test.ts
                  --maxWorkers=1 --retry=0
