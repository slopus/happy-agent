name: Verify Rust Happy Agent

on:
    pull_request:
        paths:
            [
                "Cargo.toml",
                "Cargo.lock",
                "rust-toolchain.toml",
                "packages/happy-agent/**",
                "packages/happy-agent-base/**",
                "packages/happy-providers/**",
                "packages/happy-agent-supervisor/native/**",
                ".github/workflows/verify-happy-agent-base.yml",
            ]
    push:
        branches: [main]
        paths:
            [
                "Cargo.toml",
                "Cargo.lock",
                "rust-toolchain.toml",
                "packages/happy-agent/**",
                "packages/happy-agent-base/**",
                "packages/happy-providers/**",
                "packages/happy-agent-supervisor/native/**",
                ".github/workflows/verify-happy-agent-base.yml",
            ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-rust-agent-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install the pinned Rust toolchain
              run: rustup show active-toolchain
            - name: Allow the existing supervisor's namespaces
              run: |
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi
            - name: Check formatting and types
              run: |
                  cargo fmt --all --check
                  cargo check --locked --workspace --all-targets
                  cargo clippy --locked --workspace --all-targets -- -D warnings
            - name: Verify providers, durable stages, and the real supervisor
              run: cargo test --locked --workspace
            - name: Verify the native command boundary
              run: node packages/happy-agent/scripts/smoke-rust-runtime.mjs target/debug/happy-agent
