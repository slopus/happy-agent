name: Verify Happy Agent API

on:
    pull_request:
        paths:
            - ".github/workflows/verify-happy-agent-api.yml"
            - "packages/gym-tests/**"
            - "packages/happy-agent/**"
            - "packages/happy-agent-base/**"
            - "packages/happy-agent-client/**"
            - "packages/happy-agent-gym/**"
            - "packages/happy-agent-modules/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/verify-happy-agent-api.yml"
            - "packages/gym-tests/**"
            - "packages/happy-agent/**"
            - "packages/happy-agent-base/**"
            - "packages/happy-agent-client/**"
            - "packages/happy-agent-gym/**"
            - "packages/happy-agent-modules/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:
        inputs:
            exhaustive:
                description: Run the exhaustive API gym (about 45 minutes)
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: verify-happy-agent-api-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Unprivileged Linux
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            HOME: ${{ github.workspace }}/.local/happy-agent-api-home
            NODE_OPTIONS: --max-old-space-size=6144

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the API libraries
              run: |
                  pnpm --filter @slopus/happy-agent-client build
                  pnpm --filter @slopus/happy-agent-modules build

            - name: Check the API libraries
              run: |
                  pnpm --filter @slopus/happy-agent-client check
                  pnpm --filter @slopus/happy-agent-modules check

            - name: Build the daemon
              run: pnpm --filter @slopus/happy-agent build

            - name: Check the API consumers
              run: |
                  pnpm --filter @slopus/happy-agent check
                  pnpm --filter @slopus/happy-agent-gym check
                  pnpm --filter @slopus/happy-terminal-gym-tests check

            - name: Run the Linux Files and Git preflight
              run: |
                  pnpm --filter @slopus/happy-terminal-gym-tests exec vitest run \
                    tests/happy_api_chaos_files.test.ts \
                    tests/happy_api_files_git.test.ts \
                    tests/happy_api_git_matrix.test.ts \
                    --maxWorkers=1 \
                    --retry=0

            - name: Run the complete API gym
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.exhaustive }}
              run: pnpm test:gym:api
