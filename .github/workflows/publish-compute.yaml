name: Publish happy-agent-compute

# happy-agent-compute is the only package whose correctness is an operating-system claim: the
# published native supervisor applies Seatbelt on macOS and namespaces, mounts, and seccomp on
# Linux. A release therefore proves the installed NPM artifact on both platforms before publishing.

on:
    push:
        tags:
            - "happy-agent-compute-v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing happy-agent-compute release tag to publish
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: publish-compute-${{ inputs.release_tag || github.ref_name }}
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
    sandbox:
        name: Sandbox on ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            # Both platforms report, so a one-platform sandbox regression is visible as exactly that.
            fail-fast: false
            matrix:
                include:
                    - name: macOS supervisor
                      runner: macos-15
                      docker: false
                    - name: Linux supervisor
                      runner: ubuntu-24.04
                      docker: true

        steps:
            - name: Check out the release
              uses: actions/checkout@v6
              with:
                  ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Enable Linux user namespaces
              if: runner.os == 'Linux'
              run: |
                  # The native supervisor enters an unprivileged user namespace before applying
                  # its mount and PID boundaries. Ubuntu's AppArmor sysctl disables that by default.
                  if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
                      sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-agent-compute check

            - name: Run unit tests
              env:
                  # Keep the supervisor's universal home-directory denial away from the checkout.
                  HOME: ${{ runner.temp }}/rig-test-home
                  # Refuse to let an unspawnable sandbox report the boundary cases as passing.
                  HAPPY_AGENT_COMPUTE_REQUIRE_SANDBOX: "1"
              run: |
                  mkdir -p "$HOME"
                  pnpm --filter @slopus/happy-agent-compute test

            - name: Prove the host sandbox boundary
              run: pnpm --filter @slopus/happy-agent-compute test:live:host

            - name: Prove the just-bash permission boundary
              run: pnpm --filter @slopus/happy-agent-compute test:live:just-bash

            - name: Build the container test image
              if: matrix.docker
              run: >-
                  docker build
                  --tag happy-terminal-gym:local
                  packages/happy-agent-compute/tests/fixtures

            - name: Prove the container boundary
              # GitHub's macOS runners have no Docker daemon, so the container backend is proven on
              # Linux only.
              if: matrix.docker
              run: pnpm --filter @slopus/happy-agent-compute test:live:docker

    publish:
        name: Publish @slopus/happy-agent-compute
        if: >-
            startsWith(github.ref, 'refs/tags/happy-agent-compute-v') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        needs: sandbox
        runs-on: ubuntu-24.04
        environment: npm
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        env:
            RELEASE_PACKAGE: happy-agent-compute
            RELEASE_DIST_TAG: ${{ contains(inputs.release_tag || github.ref_name, '-beta.') && 'beta' || '' }}

        steps:
            - name: Check out the release
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

            - name: Verify the tagged commit is on main
              run: |
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                      echo "Release tags must point to a commit on the main branch." >&2
                      exit 1
                  fi

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - name: Install an npm that speaks trusted publishing
              # OIDC publishing requires npm 11.5.1 or newer. Install the exact reviewed CLI with
              # pnpm, then invoke its entry point directly so Node's bundled npm cannot shadow it.
              run: |
                  pnpm add --global npm@11.18.0
                  npm_cli="$(pnpm root --global)/npm/bin/npm-cli.js"
                  test "$(node "${npm_cli}" --version)" = "11.18.0"
                  echo "NPM_CLI=${npm_cli}" >> "${GITHUB_ENV}"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify the tag matches the package version
              run: pnpm exec tsx scripts/validateReleaseTag.ts

            - name: Build the package
              run: pnpm --filter @slopus/happy-agent-compute build

            - name: Publish with GitHub trusted publishing
              run: |
                  package="@slopus/happy-agent-compute"
                  version="$(node -p "require('./packages/happy-agent-compute/package.json').version")"
                  distribution_tag="${RELEASE_DIST_TAG:-latest}"
                  if node "${NPM_CLI}" view "${package}@${version}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
                      echo "${package}@${version} is already published."
                  else
                      cd packages/happy-agent-compute
                      node "${NPM_CLI}" publish \
                          --access public \
                          --tag "${distribution_tag}" \
                          --provenance \
                          --registry https://registry.npmjs.org/
                  fi
