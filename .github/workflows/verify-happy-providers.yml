name: Verify happy-providers

on:
    pull_request:
        paths:
            - ".github/workflows/verify-happy-providers.yml"
            - "packages/happy-providers/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/verify-happy-providers.yml"
            - "packages/happy-providers/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-happy-providers-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: happy-providers
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            # The package's Bun tests run on the runtime Happy Agent ships on.
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run type checks
              run: pnpm --filter @slopus/happy-providers check

            # Live tests skip themselves without vendor credentials, which CI never has.
            - name: Run the full test suite
              run: pnpm --filter @slopus/happy-providers test

            - name: Build the package
              run: pnpm --filter @slopus/happy-providers build
