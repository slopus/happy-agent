name: Build and verify Windows Rust Agent

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string

permissions:
    contents: read

jobs:
    package:
        runs-on: windows-2025
        timeout-minutes: 60
        permissions:
            contents: read
            id-token: write
        env:
            HAPPY_AGENT_RELEASE_VERSION: ${{ inputs.version }}
            HAPPY_WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
            WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
            WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
            WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
            WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: rustup target add x86_64-pc-windows-msvc
            - name: Verify the Rust provider and durable runtime
              run: cargo test --locked --package happy-providers --package happy-agent-base
            - name: Build the single executable with a static CRT
              run: pnpm --filter @slopus/happy-agent build:native --target win32-x64
            - name: Authenticate signing with GitHub OIDC
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Install the pinned Artifact Signing module
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser
            - name: Sign and verify the executable
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              run: ./scripts/sign-windows-files.ps1 -Directory packages/happy-agent/dist/bin
            - name: Verify implemented commands in the exact release executable
              run: |
                  $binary = 'packages/happy-agent/dist/bin/happy-agent-win32-x64.exe'
                  if ((& $binary --version) -ne "Happy Agent $env:HAPPY_AGENT_RELEASE_VERSION") { throw 'Release version mismatch.' }
                  node packages/happy-agent/scripts/smoke-rust-runtime.mjs $binary
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Package the executable and npm platform tarball
              run: |
                  $name = "happy-agent-$env:HAPPY_AGENT_RELEASE_VERSION-win32-x64.tar.gz"
                  New-Item -ItemType Directory -Force release-assets | Out-Null
                  tar -czf "release-assets/$name" -C packages/happy-agent/dist/bin happy-agent-win32-x64.exe
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $name" | Set-Content "release-assets/$name.sha256" -Encoding ascii
                  node packages/happy-agent/scripts/package-native.mjs platform --version $env:HAPPY_AGENT_RELEASE_VERSION --target win32-x64 --binary packages/happy-agent/dist/bin/happy-agent-win32-x64.exe --output release-assets/npm
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node packages/happy-agent/scripts/package-native.mjs root --version $env:HAPPY_AGENT_RELEASE_VERSION --output .context/npm-root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node packages/happy-agent/scripts/verify-native-package.mjs ".context/npm-root/slopus-happy-agent-$env:HAPPY_AGENT_RELEASE_VERSION.tgz" "release-assets/npm/slopus-happy-agent-win32-x64-$env:HAPPY_AGENT_RELEASE_VERSION.tgz"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  'Windows ships inference and durable agents; its sandbox supervisor migration is incomplete.' >> $env:GITHUB_STEP_SUMMARY
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: happy-agent-win32-x64
                  path: |
                      release-assets/*.tar.gz
                      release-assets/*.sha256
                      release-assets/npm/*.tgz
                  if-no-files-found: error
                  retention-days: 7
